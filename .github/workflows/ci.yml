name: CI

on:
  workflow_dispatch:
  push:
    branches: [master2, master, integration/unified-platform]
  pull_request:
    branches: [master2, master]

jobs:
  macos:
    needs: test
    name: test (macos)
    runs-on: macos-14
    env:
      # macOS 上 offscreen 平台插件在 PySide6 6.11 下不稳定（本机已验证
      # 会触发 Qt 段错误），统一用 cocoa；CI 无头会话下 cocoa 也可用。
      QT_QPA_PLATFORM: cocoa

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust_libs
          cache-on-failure: true

      - name: Run Rust unit tests (macOS)
        # pyo3 extension-module 在测试链接时需要 libpython，必须指向 CI 的
        # CPython；abi3-py311 只要求 >=3.11。
        run: |
          cargo test --locked --workspace --release --manifest-path rust_libs/Cargo.toml

      - name: Build and install Rust wheels (macOS)
        run: |
          python -m pip install --upgrade pip
          python -m pip install maturin==1.12.6
          mkdir -p wheelhouse
          for crate in gifrecorder longstitch pyclipboard ppocr_rust; do
            maturin build --locked --release -m rust_libs/$crate/Cargo.toml --out wheelhouse
          done
          python -m pip install wheelhouse/*.whl
          python -c "import gifrecorder, longstitch, pyclipboard, ppocr_rust; print('Native extension imports OK')"

      - name: Install Python dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      - name: Platform import isolation tests
        run: |
          pytest main/tests/test_platform_imports.py main/tests/test_platform_factory.py             main/tests/test_macos_coordinates.py main/tests/test_macos_permissions.py             -c main/tests/pytest.ini -v

      - name: macOS packaging contract tests
        # 静态契约：APP_VERSION 唯一源、Mac 打包链不得写死版本号、
        # 不得 exclude ppocr_rust、OCR 模型必须作为正式构建要求。
        run: |
          pytest main/tests/test_macos_packaging_contract.py -c main/tests/pytest.ini -v

      - name: OCR import and model presence (macOS)
        # 只验证 ppocr_rust 可导入 + det/rec 模型存在；真实 OCR 推理留给 Mac 真机。
        run: |
          python - <<'PY'
          import pathlib
          import ppocr_rust

          repo = pathlib.Path.cwd()
          for name in ("PP-OCRv6_det_small.onnx", "PP-OCRv6_rec_small.onnx"):
              path = repo / "models" / name
              assert path.is_file(), f"缺少 OCR 模型: {path}"
              print("[OK] model", path, path.stat().st_size)
          print("[OK] ppocr_rust", ppocr_rust.__file__)
          PY

      - name: Core logic tests (macOS)
        # 无桌面会话下只跑不依赖真实窗口的核心逻辑测试
        run: |
          pytest main/tests/test_clipboard_api.py main/tests/test_clipboard_data.py             main/tests/test_clipboard_pagination.py main/tests/test_clipboard_move_to_top.py             main/tests/test_stitch_unified_shell.py             -c main/tests/pytest.ini -q

      - name: Shared note/text logic tests (macOS)
        # Note / Text 属于跨平台共享逻辑，macOS 无头 runner 可安全执行
        run: |
          pytest main/tests/test_note_annotation.py             main/tests/test_text_tool_modes.py             main/tests/test_text_item_undo_safe_clear.py             main/tests/test_undo_stack.py             main/tests/test_tool_settings.py             main/tests/test_core_utils.py             -c main/tests/pytest.ini -q

      - name: Build macOS .app (smoke)
        # 证明 Mac 安装包真的能构建：ad-hoc 签名 + build_macos.py 内置资源/依赖校验
        run: python build_macos.py

      - name: Verify macOS .app bundle
        run: |
          set -euo pipefail
          APP=dist/Jietuba.app
          test -x "$APP/Contents/MacOS/Jietuba"
          codesign --verify --deep --strict "$APP"
          VERSION="$(python scripts/version_utils.py)"
          PLIST_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist")"
          test "$PLIST_VERSION" = "$VERSION"
          echo "Info.plist version = $PLIST_VERSION"
          ls "$APP/Contents/Frameworks" | grep -i ppocr_rust
          ls "$APP/Contents/MacOS/models"

  test:
    name: test (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
            python-architecture: x64
            python-machine: amd64
            rust-target: x86_64-pc-windows-msvc
          - arch: arm64
            runner: windows-11-arm
            python-architecture: arm64
            python-machine: arm64
            rust-target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    env:
      # PySide6 GUI 组件在无桌面会话的 CI Runner 上需要离屏渲染
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
      PYTHONFAULTHANDLER: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # diff-cover 需要和目标分支做 diff，浅克隆里没有 base 分支的历史
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: ${{ matrix.python-architecture }}
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Verify native toolchain architecture
        run: |
          python -c "import platform; actual = platform.machine().lower(); expected = '${{ matrix.python-machine }}'; assert actual == expected, f'Python architecture {actual!r} != {expected!r}'"
          $hostLine = rustc -vV | Select-String '^host:'
          if ($hostLine -notmatch '${{ matrix.rust-target }}') {
            throw "Rust host does not match ${{ matrix.rust-target }}: $hostLine"
          }

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust_libs
          cache-on-failure: true

      - name: Run Rust unit tests
        run: cargo test --locked --workspace --release --target ${{ matrix.rust-target }} --manifest-path rust_libs/Cargo.toml

      - name: Build and install Rust wheels from this commit
        run: |
          python -m pip install --upgrade pip
          python -m pip install maturin==1.12.6
          foreach ($crate in "gifrecorder", "longstitch", "pyclipboard", "ppocr_rust") {
            maturin build --locked --release --target ${{ matrix.rust-target }} -i python -m rust_libs/$crate/Cargo.toml --out wheelhouse
            if ($LASTEXITCODE -ne 0) { throw "$crate wheel build failed" }
          }
          python -m pip install (Get-ChildItem wheelhouse\*.whl).FullName
          python -c "import gifrecorder, longstitch, pyclipboard, ppocr_rust; print('Native extension imports OK')"

      - name: Install Python dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      - name: Lint with ruff
        if: matrix.arch == 'x64'
        # 规则集见 pyproject.toml：只启用能指向真实缺陷的检查。
        # 当前为零告警，新增违规会让 CI 变红。
        run: ruff check main

      - name: Run test suite with coverage
        # 从仓库根目录运行，保证 .coveragerc 里的相对路径能正确解析。
        # --cov-fail-under 是一个只升不降的棘轮：覆盖率掉下去 CI 就红，
        # 补完测试后把这个数字往上调。
        run: >
          pytest main/tests -v -s
          -c main/tests/pytest.ini
          --cov --cov-config=.coveragerc
          --cov-report=term:skip-covered
          --cov-report=xml
          --cov-fail-under=37
          --junitxml=test-results.xml

      - name: Build current Windows software
        run: python build_with_ocr_onefile.py

      - name: Record Windows artifact provenance
        run: |
          $files = @(Get-Item dist/jietuba_pp.exe) + @(Get-ChildItem dist/models/*.onnx)
          if ($files.Count -ne 3) { throw "Expected exe and both OCR models" }
          $manifest = @{
            commit = '${{ github.sha }}'
            architecture = '${{ matrix.arch }}'
            version = (python scripts/version_utils.py)
            files = @($files | ForEach-Object { @{
              name = $_.Name
              bytes = $_.Length
              sha256 = (Get-FileHash $_.FullName -Algorithm SHA256).Hash
            } })
          }
          $manifest | ConvertTo-Json -Depth 5 | Set-Content dist/build-manifest.json

      - name: Upload current Windows software
        uses: actions/upload-artifact@v4
        with:
          name: jietuba-windows-${{ matrix.arch }}-${{ github.sha }}
          path: |
            dist/jietuba_pp.exe
            dist/models/*.onnx
            dist/build-manifest.json
          if-no-files-found: error

      - name: Exercise the real ARM64 clipboard watcher
        if: matrix.arch == 'arm64'
        env:
          RUN_CLIPBOARD_MONITOR_BENCHMARK: "1"
        run: >
          pytest main/tests/test_clipboard_monitoring_performance.py
          -c main/tests/pytest.ini -v -s

      - name: Enforce coverage on changed lines
        # 只对本次 PR 改动到的行设门槛：总量棘轮（上一步的 --cov-fail-under）
        # 防止倒退，这一步防止「新代码不带测试」。两者互补——总量涨得慢是因为
        # 存量 UI 代码基数大，不能因此放过新写的未测代码。
        # push 事件下 base 就是自己，diff 为空，因此只在 PR 上跑。
        # if 用 always()：即使总量棘轮把上一步判红，也要把增量报告给出来。
        if: always() && matrix.arch == 'x64' && github.event_name == 'pull_request'
        run: |
          if (-not (Test-Path coverage.xml)) {
            Write-Host "没有 coverage.xml（测试步骤未产出），跳过增量覆盖率检查"
            exit 0
          }
          diff-cover coverage.xml `
            --compare-branch=origin/${{ github.base_ref }} `
            --fail-under=80 `
            --format "html:diff-coverage.html,markdown:diff-coverage.md"

      - name: Publish diff coverage summary
        if: always() && matrix.arch == 'x64' && github.event_name == 'pull_request'
        run: |
          if (Test-Path diff-coverage.md) {
            Get-Content diff-coverage.md | Add-Content -Path $env:GITHUB_STEP_SUMMARY
          }

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml-${{ matrix.arch }}
          path: |
            test-results.xml
            coverage.xml
            diff-coverage.html
          if-no-files-found: warn
